<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Part Directory — Jupiter One USA</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.dir-page { padding:40px 5vw; }
.dir-type-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:28px; }
.dir-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:2px; }
.dir-list-item {
  background:var(--card); border:1px solid var(--border); padding:16px 18px;
  display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; transition:all var(--transition); text-decoration:none; color:inherit;
}
.dir-list-item:hover { border-color:var(--gold); background:var(--gold-dim); }
.dir-item-code { font-family:var(--font-mono); font-size:.78rem; color:var(--gold); font-weight:bold; min-width:48px; }
.dir-item-title { font-size:.88rem; color:var(--white); flex:1; padding:0 12px; }
.dir-item-arrow { color:var(--muted); font-size:.8rem; }
.breadcrumb { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.08em; color:var(--muted); margin-bottom:20px; }
.breadcrumb a { color:var(--gold); }
.breadcrumb span { color:var(--muted); margin:0 8px; }
</style>
</head>
<body>
<div id="nav-container"></div>
<div style="background:var(--navy2);border-bottom:1px solid var(--border);padding:40px 5vw;">
  <div class="section-label">Parts</div>
  <div class="section-title">Part Directory Hub</div>
  <p style="color:var(--muted);font-size:.9rem;">Browse by Federal Supply Group, classification code, or commercial catalog — then submit an RFQ directly.</p>
</div>

<div class="dir-page">
  <div class="dir-type-tabs">
    <button class="tab-btn active" data-type="fsg">Federal Supply Group</button>
    <button class="tab-btn" data-type="fsc">Federal Supply Class</button>
    <button class="tab-btn" data-type="commercial">Commercial Parts</button>
  </div>
  <div id="breadcrumb-area" class="breadcrumb"></div>
  <div id="dir-content"><div class="results-loading">Loading directory...</div></div>
</div>

<div id="footer-container"></div>
<script type="module">
import { api, renderNav, getNavHTML, getFooterHTML, initNavToggle } from '/js/api.js';
document.getElementById('nav-container').innerHTML = getNavHTML();
document.getElementById('footer-container').innerHTML = getFooterHTML();
renderNav(); initNavToggle();

const params = new URLSearchParams(window.location.search);
let currentType = params.get('type') || 'fsg';
let currentFsg  = params.get('fsg') || null;
let currentFsc  = params.get('fsc') || null;

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.type === currentType);
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type; currentFsg = null; currentFsc = null;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.type === currentType));
    loadDirectory();
  });
});

function updateBreadcrumb(parts) {
  const area = document.getElementById('breadcrumb-area');
  if (!parts.length) { area.innerHTML = ''; return; }
  area.innerHTML = `<a href="/pages/directory.html">Directory</a>` +
    parts.map(([label, href]) => `<span>›</span>${href ? `<a href="${href}">${label}</a>` : label}`).join('');
}

async function loadDirectory() {
  const content = document.getElementById('dir-content');
  content.innerHTML = '<div class="results-loading">Loading...</div>';

  try {
    if (currentFsc) {
      // Show NSNs in this class
      const fscData = await api.nsnClass(currentFsc, 50, 0);
      updateBreadcrumb([
        ['FSG', `/pages/directory.html?type=fsg`],
        [currentFsg, `/pages/directory.html?type=fsc&fsg=${currentFsg}`],
        [`FSC ${currentFsc}`, null],
      ]);
      if (!fscData.length) {
        content.innerHTML = '<div class="results-loading">No NSNs found in this class.</div>';
        return;
      }
      content.innerHTML = `
        <div style="background:var(--card);border:1px solid var(--border);overflow:auto;">
          <table class="results-table" style="width:100%;">
            <thead><tr><th>NSN</th><th>Item Name</th><th>Mfr Part Numbers</th><th>Status</th><th></th></tr></thead>
            <tbody>${fscData.map(row => `
              <tr>
                <td class="td-nsn">${row.nsn}</td>
                <td class="td-name">${row.item_name||'—'}</td>
                <td class="td-parts" style="font-family:var(--font-mono);font-size:.72rem;color:var(--muted);">${row.part_numbers||'—'}</td>
                <td class="${row.status==='A'?'td-status-active':'td-status-inactive'}">${row.status==='A'?'● Active':'○ Inactive'}</td>
                <td><a href="/?q=${encodeURIComponent(row.nsn)}&type=nsn" class="btn btn-primary btn-sm">Search →</a></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;

    } else if (currentFsg && currentType === 'fsc') {
      // Show FSCs in this FSG
      const fscList = await api.fscList(currentFsg);
      updateBreadcrumb([['FSG', `/pages/directory.html?type=fsg`], [`Group ${currentFsg}`, null]]);
      content.innerHTML = `<div class="dir-list">
        ${fscList.map(fsc => `
          <div class="dir-list-item" onclick="selectFsc('${fsc.fsc}')">
            <span class="dir-item-code">${fsc.fsc}</span>
            <span class="dir-item-title">${fsc.title}</span>
            <span class="dir-item-arrow">›</span>
          </div>`).join('')}
      </div>`;

    } else if (currentType === 'fsg') {
      // Show all FSGs
      const fsgList = await api.fsgList();
      updateBreadcrumb([]);
      content.innerHTML = `<div class="dir-list">
        ${fsgList.map(fsg => `
          <div class="dir-list-item" onclick="selectFsg('${fsg.fsg}')">
            <span class="dir-item-code">${fsg.fsg}</span>
            <span class="dir-item-title">${fsg.title}</span>
            <span class="dir-item-arrow">›</span>
          </div>`).join('')}
      </div>`;

    } else if (currentType === 'fsc') {
      // Show all FSGs as entry point to FSC
      const fsgList = await api.fsgList();
      updateBreadcrumb([]);
      content.innerHTML = `
        <p style="color:var(--muted);font-size:.9rem;margin-bottom:20px;">Select a Federal Supply Group to browse its classification codes.</p>
        <div class="dir-list">
          ${fsgList.map(fsg => `
            <div class="dir-list-item" onclick="selectFsg('${fsg.fsg}')">
              <span class="dir-item-code">${fsg.fsg}</span>
              <span class="dir-item-title">${fsg.title}</span>
              <span class="dir-item-arrow">›</span>
            </div>`).join('')}
        </div>`;

    } else {
      // Commercial parts — direct search
      updateBreadcrumb([]);
      content.innerHTML = `
        <div style="background:var(--card);border:1px solid var(--border);padding:32px;text-align:center;">
          <div style="font-size:2rem;margin-bottom:12px;">🔩</div>
          <div style="font-family:var(--font-display);font-weight:700;font-size:1.2rem;letter-spacing:.06em;margin-bottom:8px;">Commercial Parts Catalog</div>
          <div style="font-size:.9rem;color:var(--muted);margin-bottom:24px;max-width:460px;margin-left:auto;margin-right:auto;">
            Military aircraft structural components, mil-standard hardware, fasteners, test stands,
            and aircraft line replacement units. Search by part number to find specific items.
          </div>
          <a href="/pages/parts.html?type=part" class="btn btn-primary">Search by Part Number</a>
        </div>`;
    }
  } catch(err) {
    content.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

window.selectFsg = (fsg) => {
  currentFsg = fsg;
  currentType = 'fsc';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'fsc'));
  loadDirectory();
};

window.selectFsc = (fsc) => {
  currentFsc = fsc;
  loadDirectory();
};

loadDirectory();
</script>
</body>
</html>
