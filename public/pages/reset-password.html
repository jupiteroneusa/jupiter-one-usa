<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password — Jupiter One USA</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.auth-page{min-height:calc(100vh - 130px);display:flex;align-items:center;justify-content:center;padding:40px 5vw;}
.auth-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);width:100%;max-width:440px;padding:36px;}
</style>
</head>
<body>
<div id="nav-container"></div>
<div class="auth-page">
  <div class="auth-card">
    <div style="font-family:var(--font-display);font-weight:700;font-size:1.5rem;letter-spacing:.06em;margin-bottom:6px;">Set New Password</div>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:24px;">Enter your new password below.</div>
    <div id="msg"></div>
    <form id="reset-form" style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label class="form-label">New Password (min 8 characters)</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••" required minlength="8"/>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input class="form-input" id="confirm" type="password" placeholder="••••••••" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="reset-btn">Set New Password →</button>
    </form>
  </div>
</div>
<div id="footer-container"></div>
<script type="module">
import { api, renderNav, getNavHTML, getFooterHTML, initNavToggle, showAlert, setLoading } from '/js/api.js';
document.getElementById('nav-container').innerHTML = getNavHTML();
document.getElementById('footer-container').innerHTML = getFooterHTML();
renderNav(); initNavToggle();

const token = new URLSearchParams(window.location.search).get('token');
if (!token) window.location.href = '/pages/forgot-password.html';

document.getElementById('reset-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  if (pw !== confirm) { showAlert(document.getElementById('msg'), 'Passwords do not match.', 'error'); return; }
  const btn = document.getElementById('reset-btn');
  setLoading(btn, true, 'Saving...');
  try {
    await api.resetPassword({ token, password: pw });
    document.getElementById('reset-form').style.display = 'none';
    showAlert(document.getElementById('msg'), 'Password updated! Redirecting to login...', 'success');
    setTimeout(() => window.location.href = '/pages/login.html', 2000);
  } catch(err) {
    setLoading(btn, false);
    showAlert(document.getElementById('msg'), err.message, 'error');
  }
});
</script>
</body>
</html>
