<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password — Jupiter One USA</title>
<link rel="stylesheet" href="/css/main.css"/>
<style>
.auth-page{min-height:calc(100vh - 130px);display:flex;align-items:center;justify-content:center;padding:40px 5vw;}
.auth-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);width:100%;max-width:440px;padding:36px;}
</style>
</head>
<body>
<div id="nav-container"></div>
<div class="auth-page">
  <div class="auth-card">
    <div style="font-family:var(--font-display);font-weight:700;font-size:1.5rem;letter-spacing:.06em;margin-bottom:6px;">Reset Password</div>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:24px;">Enter your email and we'll send you a reset link.</div>
    <div id="msg"></div>
    <form id="forgot-form" style="display:flex;flex-direction:column;gap:16px;">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="email" type="email" placeholder="you@company.com" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="forgot-btn">Send Reset Link →</button>
      <a href="/pages/login.html" style="text-align:center;font-size:.82rem;color:var(--muted);">← Back to Login</a>
    </form>
  </div>
</div>
<div id="footer-container"></div>
<script type="module">
import { api, renderNav, getNavHTML, getFooterHTML, initNavToggle, showAlert, setLoading } from '/js/api.js';
document.getElementById('nav-container').innerHTML = getNavHTML();
document.getElementById('footer-container').innerHTML = getFooterHTML();
renderNav(); initNavToggle();
document.getElementById('forgot-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('forgot-btn');
  setLoading(btn, true, 'Sending...');
  try {
    await api.forgotPassword({ email: document.getElementById('email').value });
    document.getElementById('forgot-form').style.display = 'none';
    showAlert(document.getElementById('msg'), 'If an account exists, a reset link has been sent. Check your email.', 'success');
  } catch(err) {
    setLoading(btn, false);
    showAlert(document.getElementById('msg'), err.message, 'error');
  }
});
</script>
</body>
</html>
